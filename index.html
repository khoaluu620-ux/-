<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang chủ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAV -->
  <header class="nav">
    <a href="#" class="logo">LOGO</a>
    <ul class="menu">
      <li><a href="#">Trang chủ</a></li>
      <li><a href="#">Sản phẩm</a></li>
      <li><a href="#">Giới thiệu</a></li>
      <li><a href="#">Tin tức</a></li>
      <li><a href="#">Liên hệ</a></li>
    </ul>
  </header>

  <!-- BANNER -->
  <section class="banner">
    <h1>Bộ sưu tập mới</h1>
    <p>Giảm đến 50% cho các sản phẩm được chọn</p>
  </section>

  <!-- MAIN -->
  <main class="main">
    <h2 class="main-title">Sản phẩm nổi bật</h2>

    <div class="box-list">
      <div class="box">
        <div class="box-img">Ảnh</div>
        <h3>Sản phẩm 1</h3>
        <p class="price">300.000đ</p>
        <button class="btn-buy">MUA NGAY</button>
      </div>

      <div class="box">
        <div class="box-img">Ảnh</div>
        <h3>Sản phẩm 2</h3>
        <p class="price">450.000đ</p>
        <button class="btn-buy">MUA NGAY</button>
      </div>

      <div class="box">
        <div class="box-img">Ảnh</div>
        <h3>Sản phẩm 3</h3>
        <p class="price">250.000đ</p>
        <button class="btn-buy">MUA NGAY</button>
      </div>

      <div class="box">
        <div class="box-img">Ảnh</div>
        <h3>Sản phẩm 4</h3>
        <p class="price">600.000đ</p>
        <button class="btn-buy">MUA NGAY</button>
      </div>
    </div>
  </main>

</body>
</html>
