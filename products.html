<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm | Aurum Tech</title>
  <meta name="description" content="Danh sách sản phẩm công nghệ cao cấp: điện thoại, laptop, máy tính bảng, đồng hồ, tai nghe, máy ảnh – lọc theo giá, thương hiệu, đánh giá.">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">
  <a class="skip-link" href="#main">Bỏ qua đến nội dung chính</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="page-hero page-hero--compact">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <ol><li><a href="index.html">Trang chủ</a></li><li aria-current="page">Sản phẩm</li></ol>
        </nav>
        <h1 class="page-title" id="listing-title">Tất cả sản phẩm</h1>
        <p class="page-lead" id="listing-desc">Tuyển chọn thiết bị công nghệ cao cấp, chính hãng 100%.</p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container listing">
        <aside class="filters" id="filters" aria-label="Bộ lọc sản phẩm">
          <div class="filters__head">
            <h2>Bộ lọc</h2>
            <button type="button" class="icon-btn filters__close" data-close-filters aria-label="Đóng bộ lọc"><span data-icon="close"></span></button>
          </div>
          <form id="filter-form" class="filters__form" novalidate>
            <div class="filter-group">
              <label for="filter-search" class="filter-group__title">Tìm kiếm</label>
              <div class="input-icon">
                <span data-icon="search"></span>
                <input type="search" id="filter-search" name="q" class="input" placeholder="Tên, thương hiệu…" autocomplete="off">
              </div>
            </div>

            <fieldset class="filter-group">
              <legend class="filter-group__title">Danh mục</legend>
              <div class="check-group" id="filter-categories"></div>
            </fieldset>

            <fieldset class="filter-group">
              <legend class="filter-group__title">Thương hiệu</legend>
              <div class="check-group check-group--2col" id="filter-brands"></div>
            </fieldset>

            <fieldset class="filter-group">
              <legend class="filter-group__title">Khoảng giá</legend>
              <div class="check-group">
                <label class="check"><input type="radio" name="price" value="all" checked><span>Tất cả</span></label>
                <label class="check"><input type="radio" name="price" value="0-5"><span>Dưới 5 triệu</span></label>
                <label class="check"><input type="radio" name="price" value="5-15"><span>5 – 15 triệu</span></label>
                <label class="check"><input type="radio" name="price" value="15-30"><span>15 – 30 triệu</span></label>
                <label class="check"><input type="radio" name="price" value="30-"><span>Trên 30 triệu</span></label>
                <label class="check"><input type="radio" name="price" value="custom"><span>Tuỳ chọn</span></label>
              </div>
              <div class="price-range">
                <label class="sr-only" for="price-min">Giá từ (triệu đồng)</label>
                <input type="number" id="price-min" name="min" class="input" min="0" step="0.5" placeholder="Từ (triệu)" inputmode="decimal">
                <span aria-hidden="true">–</span>
                <label class="sr-only" for="price-max">Giá đến (triệu đồng)</label>
                <input type="number" id="price-max" name="max" class="input" min="0" step="0.5" placeholder="Đến (triệu)" inputmode="decimal">
              </div>
            </fieldset>

            <fieldset class="filter-group">
              <legend class="filter-group__title">Đánh giá</legend>
              <div class="check-group">
                <label class="check"><input type="radio" name="rating" value="0" checked><span>Tất cả</span></label>
                <label class="check"><input type="radio" name="rating" value="4.8"><span><span class="stars stars--sm stars--r48" aria-hidden="true"></span> từ 4,8</span></label>
                <label class="check"><input type="radio" name="rating" value="4.5"><span><span class="stars stars--sm stars--r45" aria-hidden="true"></span> từ 4,5</span></label>
              </div>
            </fieldset>

            <fieldset class="filter-group">
              <legend class="filter-group__title">Tình trạng</legend>
              <div class="check-group">
                <label class="check"><input type="checkbox" name="sale" value="1"><span>Đang giảm giá</span></label>
                <label class="check"><input type="checkbox" name="new" value="1"><span>Hàng mới về</span></label>
                <label class="check"><input type="checkbox" name="stock" value="1"><span>Còn hàng</span></label>
              </div>
            </fieldset>

            <button type="reset" class="btn btn--outline btn--block" id="filter-reset">Xoá bộ lọc</button>
          </form>
        </aside>
        <div class="filters-backdrop" data-close-filters></div>

        <div class="listing__main">
          <div class="toolbar">
            <button type="button" class="btn btn--outline btn--sm toolbar__filter-btn" data-open-filters aria-controls="filters" aria-expanded="false">
              <span data-icon="filter"></span> Bộ lọc <span class="count-pill" id="filter-count" hidden></span>
            </button>
            <p class="toolbar__count" id="result-count" aria-live="polite"></p>
            <div class="toolbar__right">
              <label for="sort-select" class="toolbar__label">Sắp xếp</label>
              <select id="sort-select" class="select">
                <option value="featured">Nổi bật</option>
                <option value="newest">Mới nhất</option>
                <option value="best">Bán chạy</option>
                <option value="price-asc">Giá: thấp → cao</option>
                <option value="price-desc">Giá: cao → thấp</option>
                <option value="discount">Giảm giá nhiều</option>
                <option value="rating">Đánh giá cao</option>
                <option value="name">Tên A → Z</option>
              </select>
              <div class="view-toggle" role="group" aria-label="Kiểu hiển thị">
                <button type="button" class="icon-btn is-active" data-view="grid" aria-pressed="true" aria-label="Dạng lưới"><span data-icon="grid"></span></button>
                <button type="button" class="icon-btn" data-view="list" aria-pressed="false" aria-label="Dạng danh sách"><span data-icon="list"></span></button>
              </div>
            </div>
          </div>
          <div class="active-filters" id="active-filters"></div>
          <div class="product-grid" id="product-list"></div>
          <nav class="pagination" id="pagination" aria-label="Phân trang"></nav>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/script.js" defer></script>
</body>
</html>
